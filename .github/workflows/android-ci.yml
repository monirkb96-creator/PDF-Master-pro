name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK licenses & platform 36.1
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ]; then
            SDK_DIR="$HOME/android-sdk"
            mkdir -p "$SDK_DIR"
          fi
          sudo mkdir -p "$SDK_DIR/licenses" "$SDK_DIR/platforms" "$SDK_DIR/build-tools" || true
          sudo chown -R "$(id -u):$(id -g)" "$SDK_DIR/licenses" "$SDK_DIR/platforms" "$SDK_DIR/build-tools" || true
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK_DIR/licenses/android-sdk-preview-license"
          printf "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n" > "$SDK_DIR/licenses/google-gdk-license"

          SDK_MGR="$(command -v sdkmanager || find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -n "$SDK_MGR" ]; then
            timeout 45 bash -c "yes | \"$SDK_MGR\" --sdk_root=\"$SDK_DIR\" --licenses > /dev/null 2>&1" || true
            if [ ! -d "$SDK_DIR/platforms/android-36.1" ]; then
              yes | "$SDK_MGR" --sdk_root="$SDK_DIR" "platforms;android-36.1" "build-tools;36.0.0" || true
            fi
          fi

      - name: Cache Robolectric & Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            m2-robolectric-

      - name: Restore cached fallback debug keystore
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: stable-debug-keystore-${{ github.repository }}-v1

      - name: Decode or generate debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Debug APK
        run: >
          gradle :app:assembleDebug
          -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"
          -Dorg.gradle.workers.max=2
          --no-configuration-cache --console=plain

      - name: Prepare PDF-Master-Pro.apk
        if: success()
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/PDF-Master-Pro.apk
          fi

      - name: Upload PDF-Master-Pro.apk artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Master-Pro-apk
          path: app/build/outputs/apk/debug/PDF-Master-Pro.apk
          if-no-files-found: ignore

      - name: Run Unit & Robolectric Tests
        run: >
          gradle :app:testDebugUnitTest
          -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"
          -Dorg.gradle.workers.max=2
          --no-configuration-cache --console=plain

      - name: Publish APK to GitHub Release (latest)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PDF Master Pro (Latest APK)
          body: Automated Android APK build for PDF Master Pro.
          files: app/build/outputs/apk/debug/PDF-Master-Pro.apk
          prerelease: false
          make_latest: true
